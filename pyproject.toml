[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urmom-lang"
version = "0.2.0"
authors = [
    {name = "Death Legion Team"},
]
description = "Urmom Lang - A standalone programming language with first-class concurrency, pattern matching, and a comprehensive standard library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["programming-language", "language", "compiler", "interpreter", "concurrency", "urmom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
urm = "src.cli:main"
urm-pkg = "src.tools.pkg_manager:main"
urm-test = "src.tools.test_runner:main"

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
