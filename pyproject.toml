[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urmom-lang"
version = "0.1.0"
description = "Urmom Lang - A modern, simple, concurrent programming language by Death Legion Team"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Death Legion Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
urm = "src.cli:main"
urm-pkg = "src.tools.pkg_manager:main"
urm-test = "src.tools.test_runner:main"

[project.urls]
Homepage = "https://github.com/death-legion/urmom-lang"
Repository = "https://github.com/death-legion/urmom-lang"
Documentation = "https://urmom-lang.dev/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
